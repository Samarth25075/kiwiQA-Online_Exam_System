<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>
  </head>
  <body>
    <div id="loading-check" style="position:fixed; top:10px; left:10px; color:red; font-weight:bold; z-index:99999;">
        [SYSTEM: HTML LOADED - WAITING FOR JAVASCRIPT...]
    </div>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        alert("CRASH DETECTED: " + msg + "\nAt: " + url + ":" + line);
        return false;
      };
      window.onunhandledrejection = function(event) {
        alert("PROMISE CRASH: " + event.reason);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
