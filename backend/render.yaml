services:
  - type: web
    name: examportal-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate_prod.py && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
